<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#353839">
<title>Reset password – RUTO</title>
<link rel="icon" href="assets/app-icon-192.png" type="image/png">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="reset-page ui-guard">
<header class="top">
 <a class="brand reset-brand" href="./index.html"><img src="assets/app-icon-192.png" alt=""><span class="wordmark" aria-label="RUTO"><span class="wordmark-text">RUTO</span></span></a>
 <div class="sp"></div>
 <span class="locale-control"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><select class="lang" id="resetLanguage" aria-label="Language">
  <option value="0">English</option>
  <option value="1">Tagalog</option>
  <option value="2">Taglish</option>
 </select></span>
</header>
<main class="reset-card card">
 <a class="reset-back" href="./index.html" data-copy="backToSignIn"></a>
 <h1 data-copy="passwordResetTitle"></h1>
 <p class="muted" id="resetIntro"></p>

 <section id="emailResetSection">
  <h2 data-copy="resetEmailTitle"></h2>
  <p class="muted" data-copy="resetEmailNote"></p>
  <form id="emailResetForm">
   <label for="resetEmail" data-copy="emailLabel"></label>
   <input id="resetEmail" type="email" autocomplete="email" required>
   <button class="btn p reset-submit" type="submit" data-copy="sendResetLink"></button>
  </form>
 </section>

 <section id="phoneResetSection">
  <h2 data-copy="resetPhoneTitle"></h2>
  <p class="muted" data-copy="resetPhoneNote"></p>
  <form id="phoneResetForm">
   <label for="resetPhone" data-copy="phoneLabel"></label>
   <div class="row">
    <input id="resetPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0917 123 4567" required>
    <button class="btn" id="sendResetCode" type="submit" data-copy="sendResetCode"></button>
   </div>
  </form>
  <form id="verifyResetForm" hidden>
   <label for="resetOtp" data-copy="resetOtpLabel"></label>
   <div class="row">
    <input id="resetOtp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
    <button class="btn p" type="submit" data-copy="verifyResetCode"></button>
   </div>
  </form>
  <form id="newPasswordForm" hidden>
   <label for="newPassword" data-copy="newPasswordLabel"></label>
   <input id="newPassword" type="password" minlength="6" autocomplete="new-password" required>
   <label for="confirmPassword" data-copy="confirmNewPassword"></label>
   <input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required>
   <button class="btn p reset-submit" type="submit" data-copy="setNewPassword"></button>
  </form>
 </section>

 <p id="resetStatus" class="reset-status" role="status" aria-live="polite"></p>
 <p id="resetError" class="err" role="alert"></p>
 <div id="resetRecaptcha"></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" integrity="sha384-AQ3POAMqIhwS81FrUH95ekxqBZHeP5tG2JfEL3+7GuTtfRLWnrRh32UxwzM+//A9" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" integrity="sha384-TnlRYaR4JYz/lpaGuaiU61PjNberSA4vjLjtF+oRC/IkohkJqnWxw5EmDSOt1vA1" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js" integrity="sha384-E3vxFxXu8FhW5kvqdQJ5Yf8ugrV7iCJP8jgnItRH2Rk8Q08cJzJGTi/oMC3FEp3j" crossorigin="anonymous"></script>
<script src="js/config.js"></script>
<script src="js/reset.js"></script>
<script src="js/ui-guard.js"></script>
</body>
</html>
