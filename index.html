<!-- LANDING + SIGN IN/UP -->
<section id="land">
 <div class="top"><div class="brand"><svg><use href="#logo"/></svg>RUTO</div><div class="sp"></div>
  <select class="lang" aria-label="Language"><option value="0">English</option><option value="1">Tagalog</option><option value="2">Taglish</option></select>
  <button class="ib th" aria-label="Theme"><svg class="i"><use href="#moon"/></svg></button></div>
 <div class="hero">
  <div class="copy"><span class="pill"><i class="dot"></i><span data-i="pill"></span></span><h1 data-i="hero"></h1><p data-i="heroP"></p>
   <div class="vrow" aria-hidden="true"><span class="vchip" style="--i:0"><svg class="i"><use href="#g-moto"/></svg></span><span class="vchip" style="--i:1"><svg class="i"><use href="#g-trike"/></svg></span><span class="vchip" style="--i:2"><svg class="i"><use href="#g-car"/></svg></span><span class="vchip" style="--i:3"><svg class="i"><use href="#g-bus"/></svg></span><span class="vchip" style="--i:4"><svg class="i"><use href="#g-van"/></svg></span><span class="vchip" style="--i:5"><svg class="i"><use href="#g-truck"/></svg></span><span class="vchip" style="--i:6"><svg class="i"><use href="#g-truck2"/></svg></span><span class="vchip" style="--i:7"><svg class="i"><use href="#g-boat"/></svg></span><span class="vchip" style="--i:8"><svg class="i"><use href="#g-ship"/></svg></span></div>
   <div class="stats"><span class="sb"><svg class="i s1"><use href="#g-truck"/></svg><span data-i="stV"></span></span><span class="sb"><svg class="i s2"><use href="#g-globe"/></svg><span data-i="stL"></span></span><span class="sb"><svg class="i s3"><use href="#g-snow"/></svg><span data-i="stC"></span></span></div>
   <svg class="art" viewBox="0 0 420 230" role="img" aria-label="Route preview"><rect width="420" height="230" rx="16" style="fill:var(--card);stroke:var(--line)"/>
    <path d="M0 60H420M0 120H420M0 180H420M80 0V230M170 0V230M260 0V230M350 0V230" style="stroke:var(--line);fill:none"/>
    <path class="flow" d="M40 180L120 110L210 150L290 70L380 100" fill="none" stroke="#FFB020" stroke-width="5" stroke-dasharray="2 10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="40" cy="180" r="13" fill="none" stroke="#FFB020" stroke-width="2"><animate attributeName="r" values="13;32" dur="2.4s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle><circle cx="380" cy="100" r="13" fill="none" stroke="#FFB020" stroke-width="2"><animate attributeName="r" values="13;32" dur="2.4s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle><g class="pp"><circle cx="40" cy="180" r="13" style="fill:#12264A;stroke:#FFB020;stroke-width:3"/><use class="ui" href="#g-warehouse" x="32" y="172" width="16" height="16" style="color:#fff"/></g><g class="pp"><circle cx="120" cy="110" r="13" style="fill:#12264A;stroke:#FFB020;stroke-width:3"/><text x="120" y="114" text-anchor="middle" style="fill:#fff;font-size:12px;font-weight:700">1</text></g><g class="pp"><circle cx="210" cy="150" r="13" style="fill:#12264A;stroke:#FFB020;stroke-width:3"/><text x="210" y="154" text-anchor="middle" style="fill:#fff;font-size:12px;font-weight:700">2</text></g><g class="pp"><circle cx="290" cy="70" r="13" style="fill:#12264A;stroke:#FFB020;stroke-width:3"/><text x="290" y="74" text-anchor="middle" style="fill:#fff;font-size:12px;font-weight:700">3</text></g><g class="pp"><circle cx="380" cy="100" r="13" style="fill:#12264A;stroke:#FFB020;stroke-width:3"/><text x="380" y="104" text-anchor="middle" style="fill:#fff;font-size:12px;font-weight:700">4</text></g><rect x="14" y="14" width="168" height="28" rx="14" style="fill:#12264A"/><use class="ui" href="#g-clock" x="24" y="21" width="14" height="14" style="color:#FFB020"/><text x="44" y="33" style="fill:#FFB020;font-size:13px;font-weight:700">₱1,240 · 2h 10m</text>
    <g><circle r="17" style="fill:#FFB020;stroke:#fff;stroke-width:2"/><use class="ui" href="#g-truck" x="-11" y="-11" width="22" height="22" style="color:#12264A"/><animateMotion dur="9s" repeatCount="indefinite" path="M40 180 L120 110 L210 150 L290 70 L380 100 L290 70 L210 150 L120 110 L40 180"/></g></svg></div>
  <form class="auth" id="auth">
   <div class="tabs"><button type="button" class="btn on" data-m="in" data-i="signin"></button><button type="button" class="btn" data-m="up" data-i="signup"></button></div>
   <div id="nmw"><label for="nm" data-i="name"></label><input id="nm" autocomplete="name"></div>
   <label for="em" data-i="email"></label><input id="em" type="email" required autocomplete="email">
   <label for="pw" data-i="pass"></label><input id="pw" type="password" required minlength="6" autocomplete="current-password">
   <p class="err" id="err" role="alert"></p>
   <button class="btn p" style="width:100%" id="sub"></button>
   <div class="or"><span data-i="orDiv"></span></div>
   <button type="button" class="btn soc" id="gbtn"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.09a6.6 6.6 0 0 1 0-4.18V7.07H2.18a11 11 0 0 0 0 9.86l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1A11 11 0 0 0 2.18 7.07l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg><span data-i="google"></span></button>
   <button type="button" class="btn soc" id="abtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg><span data-i="apple"></span></button>
  </form>
 </div>
 <div class="sec"><h2 data-i="featH"></h2><div class="feat"><div class="fc"><div class="fi"><svg class="i"><use href="#g-route"/></svg></div><h3 data-i="f1t"></h3><p data-i="f1p"></p></div><div class="fc"><div class="fi"><svg class="i"><use href="#g-truck"/></svg></div><h3 data-i="f2t"></h3><p data-i="f2p"></p></div><div class="fc"><div class="fi"><svg class="i"><use href="#g-fuel"/></svg></div><h3 data-i="f3t"></h3><p data-i="f3p"></p></div><div class="fc"><div class="fi"><svg class="i"><use href="#g-snow"/></svg></div><h3 data-i="f4t"></h3><p data-i="f4p"></p></div></div></div>
 <div class="sec"><h2 data-i="howH"></h2><div class="steps"><div class="st"><b>1</b><span data-i="s1"></span><svg class="i sico"><use href="#g-pin"/></svg></div><div class="st"><b>2</b><span data-i="s2"></span><svg class="i sico"><use href="#g-box"/></svg></div><div class="st"><b>3</b><span data-i="s3"></span><svg class="i sico"><use href="#g-trophy"/></svg></div></div></div>
 <div class="sec"><div class="cta"><h2 data-i="ctaH"></h2><button class="btn p" id="cta"><span data-i="ctaB"></span> <svg class="i arr"><use href="#g-arrow"/></svg></button><div class="road"><svg class="rtruck"><use href="#g-truck"/></svg></div></div></div>
 <footer class="foot"><svg><use href="#logo"/></svg><span data-i="foot"></span></footer>
</section>

<!-- LOCATION GATE -->
<div id="gate" hidden><div class="card"><svg style="width:64px;height:64px"><use href="#logo"/></svg><h2 data-i="locH"></h2><p class="muted" data-i="locP"></p>
 <button class="btn p" id="locbtn" data-i="locBtn"></button><p><a href="#" id="locskip" class="muted" data-i="locSkip"></a></p></div></div>

<!-- APP -->
<section id="app" hidden>
 <div class="top"><div class="brand"><svg><use href="#logo"/></svg>RUTO</div>
  <div class="tabs"><button class="btn on" data-v="plan" data-i="plan"></button><button class="btn" data-v="hist" data-i="hist"></button></div><div class="sp"></div>
  <span id="who" class="muted" style="color:#cfd8ea"></span>
  <select class="lang" aria-label="Language"><option value="0">English</option><option value="1">Tagalog</option><option value="2">Taglish</option></select>
  <button class="ib th" aria-label="Theme"><svg class="i"><use href="#moon"/></svg></button>
  <button class="btn" id="out" data-i="logout"></button></div>

 <div class="wrap" id="v_plan">
 <aside>
  <div class="card"><h2 data-i="locs"></h2>
   <label for="addr" data-i="addrL"></label>
   <input id="addr" data-ip="addrPh">
   <div class="row" style="margin-top:8px"><button class="btn p" id="addDrop"><svg class="i"><use href="#plus"/></svg> <span data-i="addDrop"></span></button><button class="btn" id="addOrg" data-i="addOrg"></button></div>
   <div class="row" style="margin-top:8px"><button class="btn" id="gps" data-i="gps"></button><button class="btn" id="clear" data-i="clear"></button></div>
   <p class="muted" data-i="clickHint"></p></div>
  <div class="card"><h2 data-i="stops"></h2><div id="stops"></div><p id="nostop" class="muted" data-i="nostop"></p></div>
  <div class="card"><h2 data-i="when"></h2>
   <div class="row"><div style="flex:1"><label for="date" data-i="date"></label><input type="date" id="date"></div><div style="flex:1"><label for="time" data-i="time"></label><input type="time" id="time" value="08:00"></div></div>
   <label><input type="checkbox" id="round" checked style="width:auto"> <span data-i="round"></span></label>
   <label for="pri" data-i="prio"></label>
   <select id="pri"><option value="balanced" data-i="pBal"></option><option value="cheap" data-i="pCheap"></option><option value="fast" data-i="pFast"></option><option value="easy" data-i="pEasy"></option></select>
   <button class="btn p" id="save" style="width:100%;margin-top:12px" data-i="save"></button></div>
  <div class="card"><h2 data-i="fuelH"></h2><div class="fuel" id="fuel"></div>
   <div class="row" style="margin-top:8px"><button class="btn" id="fuelbtn"><svg class="i"><use href="#refresh"/></svg> <span data-i="refresh"></span></button></div>
   <p class="muted" id="fuelnote"></p></div>
 </aside>
 <main>
  <div id="map"></div>
  <p id="empty" class="card muted" data-i="empty"></p>
  <div id="res" hidden>
   <div class="best" id="best"></div>
   <div class="card"><h2 data-i="tipsH"></h2><ul class="tips" id="tips"></ul></div>
   <div class="card"><h2 data-i="vehH"></h2><div class="grid" id="cards"></div></div>
   <div class="card"><h2 data-i="etaH"></h2><button class="btn" id="play" style="margin-bottom:8px"><svg class="i"><use href="#g-play"/></svg> <span data-i="play"></span></button><div class="scroll" id="eta"></div></div>
   <div class="card"><h2 data-i="cmpH"></h2><div class="scroll" id="cmp"></div></div>
   <div class="charts"><div class="card"><h2 data-i="c1H"></h2><div class="ch"><canvas id="c1"></canvas></div></div><div class="card"><h2 data-i="c2H"></h2><div class="ch"><canvas id="c2"></canvas></div></div></div>
  </div>
 </main></div>

 <div class="wrap" id="v_hist" hidden style="grid-template-columns:1fr;max-width:900px"><div class="card"><h2 data-i="histH"></h2><div id="hlist"></div></div></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/app.js"></script>
</body>
</html>
